<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Pengaduan Fasilitas Kampus FITK</title>

    <!-- Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Iconify -->
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/skeleton.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <main class="login-container">

        <!-- SKELETON -->
        <div id="loginSkeleton" class="skeleton-container">
            <div class="skeleton skeleton-form-title"></div>
            <div class="skeleton skeleton-form-subtitle"></div>
            <div class="skeleton-form-group" style="margin-top: 32px;">
                <div class="skeleton skeleton-form-label-sm"></div>
                <div class="skeleton skeleton-form-input"></div>
            </div>
            <div class="skeleton-form-group">
                <div class="skeleton skeleton-form-label-sm"></div>
                <div class="skeleton skeleton-form-input"></div>
            </div>
            <div class="skeleton skeleton-form-button"></div>
        </div>

        <!-- KONTEN ASLI -->
        <div id="loginContent" class="skeleton-hidden">

            <!-- WADAH HEADER & NOTIFIKASI -->
            <div class="header-section">
                <div class="brand-header" id="brandHeader">
                    <img src="img/logo-fitk.png" alt="Logo FITK" class="brand-logo">
                    <h1 class="brand-fakultas">FAKULTAS ILMU TARBIYAH DAN KEGURUAN</h1>
                    <p class="brand-universitas">UIN SIBER SYEKH NURJATI CIREBON</p>
                </div>
                
                <!-- Notifikasi -->
                <div id="formMessage" class="form-message" role="status" aria-live="polite" hidden></div>
            </div>

            <!-- JUDUL -->
            <h2 class="login-judul">Selamat Datang!</h2>
            <p class="login-deskripsi">Masuk ke akun Anda untuk melaporkan<br>pengaduan fasilitas kampus FITK</p>

            <!-- Form Login -->
            <form class="login-form" id="loginForm" novalidate>

                <!-- Input E-mail -->
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper" id="emailWrapper">
                        <input type="email" id="email" name="email" placeholder="Masukkan E-mail" required>
                    </div>
                    <small class="error-message" id="emailError"></small>
                </div>

                <!-- Input Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper" id="passwordWrapper">
                        <input type="password" id="password" name="password" placeholder="Masukkan Password" required>
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Lihat password">
                            <iconify-icon icon="akar-icons:eye"></iconify-icon>
                        </button>
                    </div>
                    <small class="error-message" id="passwordError"></small>
                </div>

                <!-- Tombol Login -->
                <button type="submit" class="btn-login" id="submitBtn">Login</button>   
            </form>

            <!-- Pembatas -->
            <div class="pembatas">
                <span>atau</span>
            </div>

            <!-- Tombol Registrasi -->
            <a href="register.html" class="btn-registrasi">Registrasi</a>

        </div>
    </main>

    <!-- JavaScript -->
    <script src="javascript/api.js"></script>
    <script src="javascript/login.js"></script>
</body>
</html>
