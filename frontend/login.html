<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Pengaduan Fasilitas Kampus FITK</title>

    <!-- Font Google (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome (untuk icon mata & email) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Khusus Login -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <!-- ============================================ -->
    <!-- CONTAINER LOGIN (Center, Mobile Friendly)    -->
    <!-- ============================================ -->
    <main class="login-container">

        <!-- Logo FITK -->
        <img src="img/logo-fitk.png" alt="Logo FITK SIBER AHSAN" class="login-logo">

        <!-- Nama Fakultas & Universitas -->
        <h1 class="login-fakultas">FAKULTAS ILMU TARBIYAH DAN KEGURUAN</h1>
        <p class="login-universitas">UIN SIBER SYEKH NURJATI CIREBON</p>

        <!-- Judul Form -->
        <h2 class="login-judul">Selamat Datang!</h2>
        <p class="login-deskripsi">Masuk ke akun Anda untuk melaporkan pengaduan fasilitas kampus FITK</p>

        <!-- Form Login -->
        <form class="login-form" id="loginForm">

            <!-- Input Email -->
            <div class="form-group">
                <label for="email">E-mail</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Masukkan E-mail" 
                        required
                    >
                </div>
            </div>

            <!-- Input Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Masukkan Password" 
                        required
                    >
                    <!-- Tombol toggle mata -->
                    <button 
                        type="button" 
                        class="toggle-password" 
                        id="togglePassword"
                        aria-label="Lihat password"
                    >
                        <i class="fas fa-eye-slash"></i>
                    </button>
                </div>
            </div>

            <!-- Tombol Login -->
            <button type="submit" class="btn-login">Login</button>

        </form>

        <!-- Pembatas "atau" -->
        <div class="pembatas">
            <span>atau</span>
        </div>

        <!-- Tombol Registrasi -->
        <a href="register.html" class="btn-registrasi">Registrasi</a>

    </main>

    <!-- JavaScript Khusus Login -->
    <script src="javascript/api.js"></script>
    <script src="javascript/login.js"></script>
</body>
</html>
