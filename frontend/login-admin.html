
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login Admin — FITK SIBER AHSAN</title>

    <!-- POPPINS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS LOGIN ADMIN -->
    <link
        rel="stylesheet"
        href="css/login-admin.css"
    >
</head>

<body>

    <main class="admin-login-page">

        <!-- ======================================
             PANEL KIRI — IDENTITAS FITK
        ======================================= -->
        <section
            class="admin-brand-panel"
            aria-label="Identitas FITK Siber Ahsan"
        >

            <div class="admin-brand-content">

                <div class="admin-brand-logo">
                    <img
                        src="img/logo-fitk.png"
                        alt="Logo FITK Siber Ahsan"
                    >
                </div>

                <div class="admin-brand-text">
                    <h2>
                        FAKULTAS ILMU TARBIYAH DAN KEGURUAN
                    </h2>

                    <p>
                        UIN SIBER SYEKH NURJATI CIREBON
                    </p>
                </div>

            </div>

        </section>


        <!-- ======================================
             PANEL KANAN — LOGIN ADMIN
        ======================================= -->
        <section class="admin-form-panel">

            <div class="admin-form-container">

                <!-- HEADER -->
                <div class="admin-login-header">

                    <h1>
                        Selamat Datang, Admin!
                    </h1>

                    <p>
                        Masuk untuk mengelola pengaduan<br>
                        fasilitas FITK
                    </p>

                </div>


                <!-- FORM LOGIN -->
                <form
                    id="adminLoginForm"
                    class="admin-login-form"
                    novalidate
                >

                    <div class="admin-fields">

                        <!-- ======================================
                             FIELD E-MAIL
                        ======================================= -->
                        <div class="admin-form-group">

                            <label for="adminEmail">
                                E-mail
                            </label>

                            <input
                                type="email"
                                id="adminEmail"
                                name="email"
                                placeholder="Masukkan E-mail"
                                autocomplete="username"
                                maxlength="254"
                                aria-describedby="adminEmailError"
                                required
                            >

                            
<!-- VALIDASI E-MAIL -->
<div
    id="adminEmailError"
    class="admin-field-error"
    role="alert"
    hidden
>
    <svg
        width="18"
        height="18"
        viewBox="0 0 18 18"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
    >
        <circle
            cx="9"
            cy="9"
            r="8"
            stroke="#D02316"
            stroke-width="2"
        />

        <path
            d="M9 5V9.8M9 12.6V13"
            stroke="#D02316"
            stroke-width="2"
            stroke-linecap="round"
        />
    </svg>

    <span>E-mail wajib diisi.</span>
</div>


                        </div>


                        <!-- ======================================
                             FIELD PASSWORD
                        ======================================= -->
                        <div class="admin-form-group">

                            <label for="adminPassword">
                                Password
                            </label>

                            <div class="admin-password-wrapper">

                                <input
                                    type="password"
                                    id="adminPassword"
                                    name="password"
                                    placeholder="Masukkan Password"
                                    autocomplete="current-password"
                                    aria-describedby="adminPasswordError"
                                    required
                                >


<!-- TOMBOL LIHAT PASSWORD -->
<button
    type="button"
    id="toggleAdminPassword"
    class="admin-password-toggle"
    aria-label="Tampilkan password"
    aria-pressed="false"
>

<!-- ICON MATA TERBUKA — PASSWORD TERLIHAT -->
<svg width="26" height="20" viewBox="0 0 26 20" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M24.5562 8.66543C25.1479 9.46257 25.1479 10.5387 24.5562 11.3346C22.6925 13.8404 18.221 19 13.0005 19C7.78005 19 3.30856 13.8404 1.44482 11.3346C1.15653 10.9531 1 10.4834 1 10C1 9.51656 1.15653 9.04693 1.44482 8.66543C3.30856 6.15957 7.78005 1 13.0005 1C18.221 1 22.6925 6.15957 24.5562 8.66543Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="black"/>
<path d="M16.7453 9.99972C16.7453 12.13 15.0686 13.8569 13.0003 13.8569C10.932 13.8569 9.25537 12.13 9.25537 9.99972C9.25537 7.86948 10.932 6.14258 13.0003 6.14258C15.0686 6.14258 16.7453 7.86948 16.7453 9.99972Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke="black"/>
</svg>


    <!-- ICON MATA TERTUTUP — FIGMA -->
    <svg
        id="adminEyeClosed"
        width="35"
        height="35"
        viewBox="0 0 35 35"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
    >
        <path
            d="M5.5 12.5C5.5 12.5 9.7 18.6538 17.5 18.6538C25.3 18.6538 29.5 12.5 29.5 12.5M7.9 15.0308L5.5 18.6538M29.5 18.6538L27.1048 15.0354M13.7968 18.1615L12.7 22.5M21.1756 18.1738L22.3 22.5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        />
    </svg>
</button>

</div>
<!-- AKHIR admin-password-wrapper -->

<!-- VALIDASI PASSWORD -->
<div
    id="adminPasswordError"
    class="admin-field-error"
    role="alert"
    hidden
>
    <svg
        width="18"
        height="18"
        viewBox="0 0 18 18"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
    >
        <circle
            cx="9"
            cy="9"
            r="8"
            stroke="#D02316"
            stroke-width="2"
        />
        <path
            d="M9 5V9.8M9 12.6V13"
            stroke="#D02316"
            stroke-width="2"
            stroke-linecap="round"
        />
    </svg>

    <span>Password wajib diisi.</span>
</div>

</div>

                        <!-- AKHIR admin-form-group PASSWORD -->

                    </div>
                    <!-- AKHIR admin-fields -->


                    <!-- ======================================
                         TOMBOL LOGIN
                    ======================================= -->
                    <button
                        type="submit"
                        id="adminLoginButton"
                        class="admin-login-button"
                    >

                        <span
                            id="adminLoginSpinner"
                            class="admin-login-spinner"
                            hidden
                        ></span>

                        <span id="adminLoginButtonText">
                            Login
                        </span>

                    </button>

                </form>


                <!-- NOTIFIKASI ERROR DARI BACKEND -->
                <div
                    id="adminLoginMessage"
                    class="admin-login-message"
                    role="alert"
                    aria-live="polite"
                    hidden
                ></div>

            </div>

        </section>

    </main>


    <!-- ==========================================
         NOTIFIKASI LOGIN ADMIN BERHASIL
         US-11B-FE — FIGMA DESKTOP
    =========================================== -->
    <div
        id="adminSuccessToast"
        class="admin-success-toast"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        hidden
    >

        <!-- ICON BERHASIL -->
        <div class="admin-success-icon-frame">

            <svg
                width="40"
                height="40"
                viewBox="0 0 40 40"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
            >
                <circle
                    cx="20"
                    cy="20"
                    r="20"
                    fill="#15A367"
                />

                <path
                    d="M11 20.5L17.5 27L29 14"
                    stroke="#FFFFFF"
                    stroke-width="4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>

        </div>

        <!-- TEKS NOTIFIKASI -->
        <div class="admin-success-text">

            <h3>LOGIN BERHASIL!</h3>

            <p>
                Login berhasil Anda akan dialihkan ke dashboard.
            </p>

        </div>

    </div>


    <!-- API -->
    <script src="javascript/api.js"></script>

    <!-- LOGIN ADMIN -->
    <script src="javascript/login-admin.js"></script>

</body>
</html>
