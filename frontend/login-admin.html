
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login Admin — FITK SIBER AHSAN</title>

    <!-- POPPINS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS LOGIN ADMIN -->
    <link
        rel="stylesheet"
        href="css/login-admin.css"
    >
</head>

<body>

    <main class="admin-login-page">

        <!-- ======================================
             PANEL KIRI — IDENTITAS FITK
        ======================================= -->
        <section
            class="admin-brand-panel"
            aria-label="Identitas FITK Siber Ahsan"
        >

            <div class="admin-brand-content">

                <div class="admin-brand-logo">
                    <img
                        src="img/logo-fitk.png"
                        alt="Logo FITK Siber Ahsan"
                    >
                </div>

                <div class="admin-brand-text">
                    <h2>
                        FAKULTAS ILMU TARBIYAH DAN KEGURUAN
                    </h2>

                    <p>
                        UIN SIBER SYEKH NURJATI CIREBON
                    </p>
                </div>

            </div>

        </section>


        <!-- ======================================
             PANEL KANAN — LOGIN ADMIN
        ======================================= -->
        <section class="admin-form-panel">

            <div class="admin-form-container">

                <!-- HEADER -->
                <div class="admin-login-header">

                    <h1>
                        Selamat Datang, Admin!
                    </h1>

                    <p>
                        Masuk untuk mengelola pengaduan<br>
                        fasilitas FITK
                    </p>

                </div>


                <!-- FORM LOGIN -->
                <form
                    id="adminLoginForm"
                    class="admin-login-form"
                    novalidate
                >

                    <div class="admin-fields">

                        <!-- ======================================
                             FIELD E-MAIL
                        ======================================= -->
                        <div class="admin-form-group">

                            <label for="adminEmail">
                                E-mail
                            </label>

                            <input
                                type="email"
                                id="adminEmail"
                                name="email"
                                placeholder="Masukkan E-mail"
                                autocomplete="username"
                                maxlength="254"
                                aria-describedby="adminEmailError"
                                required
                            >

                            
<!-- VALIDASI E-MAIL -->
<div
    id="adminEmailError"
    class="admin-field-error"
    role="alert"
    hidden
>
    <svg
        width="18"
        height="18"
        viewBox="0 0 18 18"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
    >
        <circle
            cx="9"
            cy="9"
            r="8"
            stroke="#D02316"
            stroke-width="2"
        />

        <path
            d="M9 5V9.8M9 12.6V13"
            stroke="#D02316"
            stroke-width="2"
            stroke-linecap="round"
        />
    </svg>

    <span>E-mail wajib diisi.</span>
</div>


                        </div>


                        <!-- ======================================
                             FIELD PASSWORD
                        ======================================= -->
                        <div class="admin-form-group">

                            <label for="adminPassword">
                                Password
                            </label>

                            <div class="admin-password-wrapper">

                                <input
                                    type="password"
                                    id="adminPassword"
                                    name="password"
                                    placeholder="Masukkan Password"
                                    autocomplete="current-password"
                                    aria-describedby="adminPasswordError"
                                    required
                                >


<!-- TOMBOL LIHAT PASSWORD -->
<button
    type="button"
    id="toggleAdminPassword"
    class="admin-password-toggle"
    aria-label="Tampilkan password"
    aria-pressed="false"
>

<!-- ICON MATA TERBUKA — PASSWORD TERLIHAT -->
<svg
    id="adminEyeOpen"
    width="35"
    height="35"
    viewBox="0 0 35 35"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
    hidden
>
    <path
        d="M29.0562 16.1654C29.6479 16.9626 29.6479 18.0387 29.0562 18.8346C27.1925 21.3404 22.721 26.5 17.5005 26.5C12.28 26.5 7.80856 21.3404 5.94482 18.8346C5.65653 18.4531 5.5 17.9834 5.5 17.5C5.5 17.0166 5.65653 16.5469 5.94482 16.1654C7.80856 13.6596 12.28 8.5 17.5005 8.5C22.721 8.5 27.1925 13.6596 29.0562 16.1654Z"
        stroke="black"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
    />
    <path
        d="M21.2453 17.4997C21.2453 19.63 19.5686 21.3569 17.5003 21.3569C15.432 21.3569 13.7554 19.63 13.7554 17.4997C13.7554 15.3695 15.432 13.6426 17.5003 13.6426C19.5686 13.6426 21.2453 15.3695 21.2453 17.4997Z"
        stroke="black"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
    />
</svg>


    <!-- ICON MATA TERTUTUP — FIGMA -->
    <svg
        id="adminEyeClosed"
        width="35"
        height="35"
        viewBox="0 0 35 35"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
    >
        <path
            d="M5.5 12.5C5.5 12.5 9.7 18.6538 17.5 18.6538C25.3 18.6538 29.5 12.5 29.5 12.5M7.9 15.0308L5.5 18.6538M29.5 18.6538L27.1048 15.0354M13.7968 18.1615L12.7 22.5M21.1756 18.1738L22.3 22.5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        />
    </svg>
</button>

</div>
<!-- AKHIR admin-password-wrapper -->

<!-- VALIDASI PASSWORD -->
<div
    id="adminPasswordError"
    class="admin-field-error"
    role="alert"
    hidden
>
    <svg
        width="18"
        height="18"
        viewBox="0 0 18 18"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
    >
        <circle
            cx="9"
            cy="9"
            r="8"
            stroke="#D02316"
            stroke-width="2"
        />
        <path
            d="M9 5V9.8M9 12.6V13"
            stroke="#D02316"
            stroke-width="2"
            stroke-linecap="round"
        />
    </svg>

    <span>Password wajib diisi.</span>
</div>

</div>

                        <!-- AKHIR admin-form-group PASSWORD -->

                    </div>
                    <!-- AKHIR admin-fields -->


                    <!-- ======================================
                         TOMBOL LOGIN
                    ======================================= -->
                    <button
                        type="submit"
                        id="adminLoginButton"
                        class="admin-login-button"
                    >

                        <span
                            id="adminLoginSpinner"
                            class="admin-login-spinner"
                            hidden
                        ></span>

                        <span id="adminLoginButtonText">
                            Login
                        </span>

                    </button>

                </form>


                <!-- NOTIFIKASI ERROR DARI BACKEND -->
                <div
                    id="adminLoginMessage"
                    class="admin-login-message"
                    role="alert"
                    aria-live="polite"
                    hidden
                ></div>

            </div>

        </section>

    </main>


    <!-- ==========================================
         NOTIFIKASI LOGIN ADMIN BERHASIL
         US-11B-FE — FIGMA DESKTOP
    =========================================== -->
    <div
        id="adminSuccessToast"
        class="admin-success-toast"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        hidden
    >

        <!-- ICON BERHASIL -->
        <div class="admin-success-icon-frame">

            <svg
                width="40"
                height="40"
                viewBox="0 0 40 40"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
            >
                <circle
                    cx="20"
                    cy="20"
                    r="20"
                    fill="#15A367"
                />

                <path
                    d="M11 20.5L17.5 27L29 14"
                    stroke="#FFFFFF"
                    stroke-width="4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>

        </div>

        <!-- TEKS NOTIFIKASI -->
        <div class="admin-success-text">

            <h3>LOGIN BERHASIL!</h3>

            <p>
                Login berhasil Anda akan dialihkan ke dashboard.
            </p>

        </div>

    </div>


    <!-- API -->
    <script src="javascript/api.js"></script>

    <!-- LOGIN ADMIN -->
    <script src="javascript/login-admin.js"></script>

</body>
</html>
